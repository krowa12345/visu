<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sterowania Półkami - SCADA</title>
    <link rel="stylesheet" href="panel_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <button type="button" class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Rozwiń menu">
                <span>☰</span>
            </button>
        </div>
        <div class="sidebar-menu">
            <a href="#" class="sidebar-item active">
                <span class="sidebar-icon">🕹️</span>
                <span class="sidebar-text">Kontroler</span>
            </a>
            <a href="#" class="sidebar-item">
                <span class="sidebar-icon">✏️</span>
                <span class="sidebar-text">Kreator</span>
            </a>
            <a href="#" class="sidebar-item">
                <span class="sidebar-icon">❌</span>
                <span class="sidebar-text">Wyloguj się</span>
            </a>
            <!-- Przycisk chowania z nową klasą mobile-hide-btn -->
            <a href="javascript:void(0)" class="sidebar-item mobile-hide-btn" onclick="toggleNavbarVisibility()">
                <span class="sidebar-icon">🔽</span>
                <span class="sidebar-text">Ukryj menu</span>
            </a>

        </div>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <span class="sidebar-icon">👤</span>
                <span class="sidebar-text">Operator</span>
            </div>
        </div>
    </nav>

    <div class="scada-layout">
        
        <div class="scada-col">
            <div class="panel-container fvw-panel">
                <span class="panel-title">Nawigacja</span>
                <div class="action-form">
                    <div class="input-group" style="margin-bottom: 13px;">
                        <label class="input-label">Odstęp:</label>
                        <input type="number" id="input_odstep" step="1" value="0" class="scada-input">
                        <span class="input-unit">mm</span>
                    </div>
                    <div class="buttons-row">
                        <button type="button" class="indicator-btn btn-nav nav-btn" onclick="sendNavCommand('poprzednia_polka', this)">
                            <span class="btn-icon">◄</span>
                            <span class="btn-text">POPRZEDNIA</span>
                        </button>
                        <button type="button" class="indicator-btn btn-nav nav-btn" onclick="sendNavCommand('nastepna_polka', this)">
                            <span class="btn-text">NASTĘPNA</span>
                            <span class="btn-icon">►</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="panel-container fvw-panel">
                <span class="panel-title">Precyzyjny Przesuw</span>
                <div class="buttons-row move-buttons">
                    <button type="button" class="indicator-btn btn-move btn-move-minus" onclick="sendCommand('tyl_2mm', this)">
                        <span class="btn-value">-2</span>
                        <span class="btn-unit">mm</span>
                    </button>
                    <button type="button" class="indicator-btn btn-move btn-move-minus" onclick="sendCommand('tyl_1mm', this)">
                        <span class="btn-value">-1</span>
                        <span class="btn-unit">mm</span>
                    </button>
                    <button type="button" class="indicator-btn btn-move btn-move-plus" onclick="sendCommand('przod_1mm', this)">
                        <span class="btn-value">+1</span>
                        <span class="btn-unit">mm</span>
                    </button>
                    <button type="button" class="indicator-btn btn-move btn-move-plus" onclick="sendCommand('przod_2mm', this)">
                        <span class="btn-value">+2</span>
                        <span class="btn-unit">mm</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="scada-col">
            <div class="panel-container fvw-panel">
                <span class="panel-title">Przejazd na półkę</span>
                <div class="action-form">
                    <div class="input-group">
                        <label class="input-label">Numer półki:</label>
                        <input type="number" id="input_nr_polki" min="1" max="100" value="1" class="scada-input">
                    </div>
                    <button type="button" class="action-btn btn-start" onclick="sendComplexCommand('przejazd_na_polke', 'input_nr_polki', 'nr_polki', this)">
                        <span class="action-text">PRZEJEDŹ DO PÓŁKI</span>
                    </button>
                </div>
            </div>

            <div class="panel-container fvw-panel">
                <span class="panel-title">Przejazd na pozycję</span>
                <div class="action-form">
                    <div class="input-group">
                        <label class="input-label">Pozycja:</label>
                        <input type="number" id="input_pozycja" step="0.1" value="0" class="scada-input">
                        <span class="input-unit">mm</span>
                    </div>
                    <button type="button" class="action-btn btn-zero-pos" onclick="sendComplexCommand('przejazd_na_pozycje', 'input_pozycja', 'pozycja_zadana', this)">
                        <span class="action-text">PRZEJEDŹ NA POZYCJĘ</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="scada-col">
            <div class="panel-container flw-panel status-panel">
                <span class="panel-title">Status Systemu</span>
                
                <div class="fvw-grid">
                    <div id="panel_s1" class="mode-section">
                        <div class="mode-header">
                            <span class="mode-label">Tryb S1</span>
                            <span id="ind_s1" class="mode-indicator"></span>
                        </div>
                        <div id="txt_s1" class="mode-status-text">NIEAKTYWNY</div>
                    </div>
                    <div id="panel_s2" class="mode-section">
                        <div class="mode-header">
                            <span class="mode-label">Tryb S2</span>
                            <span id="ind_s2" class="mode-indicator"></span>
                        </div>
                        <div id="txt_s2" class="mode-status-text">NIEAKTYWNY</div>
                    </div>
                </div>
                
                <div class="data-section">
                    <div class="data-row">
                        <span class="data-label">Aktualna półka:</span>
                        <span id="val_polka" class="data-value">0</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Pozycja bazy:</span>
                        <span id="val_pos_bazy" class="data-value">0.00 mm</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Aktualna pozycja osi:</span>
                        <span id="val_pos_osi" class="data-value">0.00 mm</span>
                    </div>
                </div>

                <div class="action-form" style="margin-top: 18px;">
                    <button type="button" class="action-btn btn-estop" onclick="sendCommand('zapisz_pozycje', this)">
                        <span class="action-icon">💾</span>
                        <span class="action-text">ZAPISZ POZYCJĘ</span>
                    </button>
                </div>
            </div>

            <div id="panel_conn" class="panel-container flw-panel connection-panel disconnected">
                <span class="panel-title">Połączenie</span>
                <div class="connection-content">
                    <div class="input-group" style="margin-bottom: 10px;">
                        <label class="input-label" style="min-width: 80px;">NetID:</label>
                        <input type="text" id="input_net_id" placeholder="np. 192.168..." class="scada-input" style="text-align: left;" oninput="checkInputs()">
                    </div>
                    <div class="input-group" style="margin-bottom: 10px;">
                        <label class="input-label" style="min-width: 80px;">Nr maszyny:</label>
                        <input type="number" id="input_masch_nr" placeholder="Wpisz nr..." class="scada-input" style="text-align: left;" oninput="checkInputs()">
                    </div>
                    <div class="connection-status-row" style="margin-bottom: 13px;">
                        <span class="connection-label">Status:</span>
                        <span id="txt_conn" class="connection-value disconnected">
                            <span id="ind_conn" class="status-dot disconnected"></span>
                            <span id="lbl_conn">CZEKAM NA DANE</span>
                        </span>
                    </div>
                    <button type="button" id="btn_toggle_conn" class="action-btn btn-start" onclick="toggleConnection(this)">
                        <span id="btn_conn_text" class="action-text">POŁĄCZ</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pływający przycisk przywracania menu (widoczny tylko, gdy menu jest ukryte) -->
    <button id="fab-show-menu" class="fab-show-menu" onclick="toggleNavbarVisibility()" title="Pokaż menu">
        <span>☰</span>
    </button>

    <script>
        const FIREBASE_URL = "https://rtxwebpage-aab9d-default-rtdb.europe-west1.firebasedatabase.app/panel_okno";
        let isConnected = false;
        let odstepInitialized = false;

        // --- FUNKCJA CHOWANIA/POKAZYWANIA CAŁEGO MENU ---
        function toggleNavbarVisibility() {
            const sidebar = document.getElementById('sidebar');
            const fab = document.getElementById('fab-show-menu');
            const body = document.body;
            
            sidebar.classList.toggle('nav-hidden');
            body.classList.toggle('nav-hidden-body');
            
            if(sidebar.classList.contains('nav-hidden')) {
                fab.classList.add('visible');
            } else {
                fab.classList.remove('visible');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('expanded');
        }

        function showMobileSentFeedback(btn) {
            if (!btn || window.innerWidth > 768) return;
            if (btn.classList.contains('btn-move')) return;

            let textSpan = btn.querySelector('.btn-text, .action-text');

            if (textSpan) {
                const originalText = textSpan.innerText;
                btn.classList.add('mobile-sent-active');
                textSpan.innerText = "WYSŁANO";

                setTimeout(() => {
                    btn.classList.remove('mobile-sent-active');
                    textSpan.innerText = originalText;
                }, 300);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Domyślne ukrywanie navbara tylko na małych ekranach (telefonach)
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                const fab = document.getElementById('fab-show-menu');
                const body = document.body;
                
                sidebar.classList.add('nav-hidden');
                body.classList.add('nav-hidden-body');
                fab.classList.add('visible');
            }

            const cachedNetId = localStorage.getItem('saved_net_id');
            const cachedMaschNr = localStorage.getItem('saved_masch_nr');
            
            if (cachedNetId) document.getElementById('input_net_id').value = cachedNetId;
            if (cachedMaschNr) document.getElementById('input_masch_nr').value = cachedMaschNr;
            
            checkInputs();
        });

        function checkInputs() {
            if (isConnected) return;
            const netId = document.getElementById('input_net_id').value.trim();
            const maschNr = document.getElementById('input_masch_nr').value.trim();
            const lblConn = document.getElementById('lbl_conn');
            
            if (netId === "" || maschNr === "") {
                lblConn.innerText = "CZEKAM NA DANE";
            } else {
                lblConn.innerText = "ROZŁĄCZONO";
            }
        }

        async function sendCommand(cmd, btn = null) {
            if (btn) showMobileSentFeedback(btn);
            if (!isConnected) return;
            const payload = {};
            payload[cmd] = "TRIGGER";
            try {
                await fetch(`${FIREBASE_URL}/commands.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("Błąd wysyłania komendy:", error);
            }
        }

        async function sendComplexCommand(cmd, inputId, paramName, btn = null) {
            if (btn) showMobileSentFeedback(btn);
            if (!isConnected) return;
            const val = document.getElementById(inputId).value;
            const payload = {};
            payload[cmd] = "TRIGGER";
            payload[paramName] = parseFloat(val);
            try {
                await fetch(`${FIREBASE_URL}/commands.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("Błąd wysyłania komendy złożonej:", error);
            }
        }

        async function sendNavCommand(action, btn = null) {
            if (btn) showMobileSentFeedback(btn);
            if (!isConnected) return;
            const odstepVal = document.getElementById('input_odstep').value;
            const payload = {};
            payload[action] = "TRIGGER";
            if (odstepVal !== "") {
                payload['odstep_polek'] = parseFloat(odstepVal);
            }
            try {
                await fetch(`${FIREBASE_URL}/commands.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("Błąd wysyłania komendy nawigacji:", error);
            }
        }

        async function toggleConnection(btn = null) {
            if (btn) showMobileSentFeedback(btn);
            const netIdInput = document.getElementById('input_net_id');
            const maschNrInput = document.getElementById('input_masch_nr');
            const netId = netIdInput.value.trim();
            const maschNr = maschNrInput.value.trim();
            
            if (!isConnected && (netId === "" || maschNr === "")) {
                alert("Musisz podać zarówno NetID, jak i numer maszyny!");
                return;
            }

            const action = isConnected ? 'DISCONNECT' : 'CONNECT';
            
            const payload = {
                connect_action: action,
                net_id: isConnected ? "" : netId,
                masch_nr: isConnected ? 0 : parseInt(maschNr)
            };
            
            try {
                await fetch(`${FIREBASE_URL}/commands.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (isConnected) {
                    localStorage.removeItem('saved_net_id');
                    localStorage.removeItem('saved_masch_nr');
                    netIdInput.value = "";
                    maschNrInput.value = "";
                    netIdInput.disabled = false;
                    maschNrInput.disabled = false;
                    checkInputs();
                    odstepInitialized = false;
                } else {
                    localStorage.setItem('saved_net_id', netId);
                    localStorage.setItem('saved_masch_nr', maschNr);
                }

            } catch (error) {
                console.error("Błąd przełączania połączenia:", error);
            }
        }

        async function fetchData() {
            try {
                const response = await fetch(`${FIREBASE_URL}/indicators.json`);
                const data = await response.json();

                const currentTime = Date.now();
                const isServerActive = data && data.timestamp && (currentTime - data.timestamp < 3000);

                if (!isServerActive) {
                    isConnected = false;
                    document.getElementById('lbl_conn').innerText = "WYŁĄCZONO";
                    document.getElementById('panel_conn').className = "panel-container flw-panel connection-panel disconnected";
                    document.getElementById('txt_conn').className = "connection-value disconnected";
                    document.getElementById('ind_conn').className = "status-dot disconnected";
                    
                    const btnConnText = document.getElementById('btn_conn_text');
                    if(btnConnText.innerText !== "WYSŁANO") btnConnText.innerText = "POŁĄCZ";
                    document.getElementById('btn_toggle_conn').className = "action-btn btn-start";
                    
                    document.getElementById('input_net_id').disabled = false;
                    document.getElementById('input_masch_nr').disabled = false;
                    odstepInitialized = false;
                    return;
                }

                document.getElementById('val_polka').innerText = data.aktualna_polka || 0;
                
                const posOsi = parseFloat(data.pozycja_osi || 0).toFixed(2);
                const posBazy = parseFloat(data.pozycja_bazy || 0).toFixed(2);
                document.getElementById('val_pos_osi').innerText = `${posOsi} mm`;
                document.getElementById('val_pos_bazy').innerText = `${posBazy} mm`;

                if (data.odstep_polek !== undefined && !odstepInitialized) {
                    document.getElementById('input_odstep').value = data.odstep_polek;
                    odstepInitialized = true;
                }

                const isConn = data.polaczenie === true;
                isConnected = isConn;
                
                const netIdInput = document.getElementById('input_net_id');
                const maschNrInput = document.getElementById('input_masch_nr');

                document.getElementById('panel_conn').className = `panel-container flw-panel connection-panel ${isConn ? 'connected' : 'disconnected'}`;
                document.getElementById('txt_conn').className = `connection-value ${isConn ? 'connected' : 'disconnected'}`;
                document.getElementById('ind_conn').className = `status-dot ${isConn ? 'connected' : 'disconnected'}`;
                
                if (data.status_opis) {
                    document.getElementById('lbl_conn').innerText = data.status_opis;
                } else {
                    document.getElementById('lbl_conn').innerText = isConn ? "POŁĄCZONO Z PLC" : "ROZŁĄCZONO";
                }

                const btnConnText = document.getElementById('btn_conn_text');
                const btnConn = document.getElementById('btn_toggle_conn');
                
                if (isConn) {
                    if(btnConnText.innerText !== "WYSŁANO") btnConnText.innerText = "ROZŁĄCZ";
                    btnConn.className = "action-btn btn-estop";
                    netIdInput.disabled = true;
                    maschNrInput.disabled = true;
                } else {
                    if(btnConnText.innerText !== "WYSŁANO") btnConnText.innerText = "POŁĄCZ";
                    btnConn.className = "action-btn btn-start";
                    netIdInput.disabled = false;
                    maschNrInput.disabled = false;
                    odstepInitialized = false;
                }

                const isS1 = data.tryb_s1 === true;
                document.getElementById('panel_s1').className = `mode-section ${isS1 ? 'active' : ''}`;
                document.getElementById('ind_s1').className = `mode-indicator ${isS1 ? 'active' : ''}`;
                document.getElementById('txt_s1').className = `mode-status-text ${isS1 ? 'active' : ''}`;
                document.getElementById('txt_s1').innerText = isS1 ? "AKTYWNY" : "NIEAKTYWNY";

                const isS2 = data.tryb_s2 === true;
                document.getElementById('panel_s2').className = `mode-section ${isS2 ? 'active' : ''}`;
                document.getElementById('ind_s2').className = `mode-indicator ${isS2 ? 'active' : ''}`;
                document.getElementById('txt_s2').className = `mode-status-text ${isS2 ? 'active' : ''}`;
                document.getElementById('txt_s2').innerText = isS2 ? "AKTYWNY" : "NIEAKTYWNY";

            } catch (error) {
                console.error("Błąd pobierania danych z Firebase:", error);
            }
        }

        document.querySelectorAll('.scada-input').forEach(input => {
            const moveCursorToEnd = function() {
                if (this.value !== "") {
                    setTimeout(() => {
                        const val = this.value;
                        this.value = '';
                        this.value = val;
                    }, 10);
                }
            };
            input.addEventListener('focus', moveCursorToEnd);
            input.addEventListener('click', moveCursorToEnd);
        });

        setInterval(fetchData, 500);
        fetchData();
    </script>
</body>
</html>
